schema_version: "0.1"

capabilities:
  apple/xcode-automation:
    adoption: recommended
    implementation:
      name: mobilebuildmcp
      kind: mcp
      source: https://github.com/getsentry/MobileBuildMCP
      version: "2.7.1"
      revision: d13ff0c707b0681769cf31da0eb42c4f94ceafff
      command: npx -y mobilebuildmcp@2.7.1 mcp
      selected_when:
        - The starter uses the pinned portable server; validate the project's build/test flows before adoption.
    alternatives:
      - name: xcode-mcp
        kind: mcp
        source: https://developer.apple.com/documentation/xcode/giving-external-agents-access-to-xcode
        version: selected-Xcode
        revision: null
        command: xcrun mcpbridge
        selected_when:
          - The project is open in Xcode with approved external-agent access.
          - Xcode 27 headless mode is explicitly enabled and the agent and project access are approved.
    scope:
      - local_development
      - simulator
      - real_device
    recommended_when:
      - External coding agents build, inspect, or modify the open Xcode project.
      - Agents run build, test, or Simulator operations without a human at the keyboard.
    limitations:
      - xcrun mcpbridge requires an approved Xcode session or an explicitly enabled headless session with project access.
      - mobilebuildmcp is a third-party Node package that runs with local developer privileges.
      - No MCP implementation runs in CI; the make targets remain the gate-facing interface.
      - An MCP tool call is not reproducible evidence a reviewer can rerun from the repository.
      - mobilebuildmcp loads only its simulator workflows by default, and its enabled-workflow
        variable replaces the defaults rather than extending them, so the list must name every
        workflow in use — UI automation included.
      - From mobilebuildmcp 2.x the package needs its `mcp` subcommand; without it the process
        prints CLI help and exits, which presents as a server that never starts.
      - mobilebuildmcp screenshot and snapshot_ui use session defaults; their 2.7.1 schemas have no Simulator-ID argument.
        Set simulatorId through session_set_defaults and check the returned device before attributing evidence.
    guardrails:
      - Use the Xcode version and project declared in AGENTS.md.
      - Signing, entitlement, certificate, and release actions remain protected.
      - Record the selected implementation and its pinned version in AGENTS.md.
      - Pin a third-party server to an evaluated version; never resolve it from a floating tag.
      - Reproduce every gate result through make targets before reporting it as evidence.
      - In parallel runs pin each build and test to the worker's own destination UDID.
      - Disable the server's own telemetry. mobilebuildmcp reports its internal runtime faults to
        a third-party service unless MOBILEBUILDMCP_SENTRY_DISABLED=true is set; a client project
        should emit nothing outward it has not agreed to.
      - Check the device id echoed back by any screenshot or snapshot call, or drive a second
        device through xcrun simctl, before attaching the output as evidence.
      - Commit the server configuration and the settings file that approves it, so the capability
        is part of the repository rather than of one machine.
    fallbacks:
      - Repository Makefile commands and xcodebuild.
      - Filtered xcodebuild output (xcbeautify or equivalent) plus xcresult inspection.

  apple/ios-simulator-automation:
    adoption: recommended_conditional
    implementation:
      name: tapia-mcp
      kind: mcp
      source: github://Agilefreaks/tapia-mcp
      version: "0.2.0"
      revision: 74ddfd95710801f7ff33a48e0a42bdfff5c15e02
      command: tapia-mcp
    scope:
      - local_development
      - simulator
    recommended_when:
      - Coding agents implement or verify material application UI.
      - Critical simulator flows are repeated during vertical-slice development.
      - The delivery item requires inspectable local runtime evidence.
    limitations:
      - Simulator evidence does not verify a real device or distributed build.
      - System overlays may not appear in the application accessibility tree.
      - Recorded flows drift when screen anchors, identifiers, or behavior change.
      - The package version remains 0.2.0; identify this update by its full revision.
      - Xcode 27 input requires matched Homebrew idb-cli and idb-companion.
      - Upstream documents a 1.6.3 baseline; the 2026-10-02 local toolchain smoke check passed with both at 1.6.4. Version 1.6.3 was not exercised locally.
    guardrails:
      - From the pinned Tapia source checkout, run ./scripts/tapia-install and restart the MCP connection after upgrading.
      - The same pipx install exposes tapia-mcp and tapia-sim; keep its bin directory on PATH.
      - The project manifest records the evaluated Tapia pin and supersedes older example revisions in the adopted playbook.
      - From that Tapia source checkout, run ./scripts/tapia-doctor; verify Homebrew idb is first on PATH and exercise input separately.
      - Use only non-production environments, test accounts, and synthetic data.
      - Prefer accessibilityIdentifier selectors over labels or coordinates.
      - Auto-accept is allowed only for a bounded simulator-only session.
      - Do not treat screenshots or flow success as PRODUCTION_VERIFIED or DELIVERED.
      - In parallel runs each concurrent worker uses its own dedicated Simulator UDID and pins every operation to it.
      - Never restart, shut down, erase, or re-boot a shared Simulator during a parallel session.
    fallbacks:
      - XCUITest for durable regression checks.
      - xcrun simctl and idb for diagnostics and recovery.
      - Manual simulator verification when the MCP capability is unavailable.
